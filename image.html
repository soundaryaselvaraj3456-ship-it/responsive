<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Responsive Website</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4,#a18cd1,#84fab0);
      text-align:center;
    }

    h1{
      color:white;
      font-size:60px;
      font-weight:bold;
      margin-bottom:30px;
      text-shadow:3px 3px 10px rgba(0,0,0,0.3);
    }

    .btn-custom{
      padding:15px 40px;
      font-size:25px;
      font-weight:bold;
      border:none;
      border-radius:50px;
      color:white;
      background:linear-gradient(to right,#ff416c,#ff4b2b);
      box-shadow:0 8px 20px rgba(0,0,0,0.3);
      transition:0.3s;
    }

    .btn-custom:hover{
      transform:scale(1.1);
      background:linear-gradient(to right,#6a11cb,#2575fc);
    }

    @media(max-width:768px){
      h1{
        font-size:35px;
      }

      .btn-custom{
        font-size:18px;
        padding:12px 25px;
      }
    }
  </style>
</head>

<body>

  <h1>Responsive Website</h1>

  <button class="btn-custom" onclick="showAlert()">
    Click Me ✨
  </button>

  <script>
    function showAlert(){
      alert("🌈 Welcome to Responsive Website!");
    }
  </script>

</body>
</html>
